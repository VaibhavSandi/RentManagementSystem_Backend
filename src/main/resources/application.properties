# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Rent calculation ─────────────────────────────────────────────
# Months between the rent month and the month it is collected in.
# 1 = October collects September rent; 0 = rent is collected in the same month.
rent.due.month-offset=1
# Optional yyyy-MM: no rent is expected before this month. Set it to the month
# payments started being recorded in this system, to avoid false arrears.
rent.calculation.start-month=${RENT_CALCULATION_START_MONTH:}

# ── Monthly pending rent report (ONE email to the owner; renters are never emailed) ──
rent.reminder.enabled=true
rent.reminder.day=25
rent.reminder.hour=9
rent.reminder.minute=0
rent.reminder.zone=Asia/Kolkata
# TODO: replace with the owner's email address (the only recipient)
rent.reminder.owner-email=owner@example.com
# false = no email in a month where nobody has pending rent (only a log line)
rent.reminder.send-when-no-pending=false
rent.reminder.from=${MAIL_FROM:${MAIL_USERNAME:}}

# SMTP (e.g. Gmail with an app password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
