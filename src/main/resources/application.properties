spring.servlet.multipart.max-request-size=10MB

# ── Rent calculation ─────────────────────────────────────────────
# Months between the rent month and the month it is collected in.
# 1 = October collects September rent; 0 = rent is collected in the same month.
rent.due.month-offset=1
# Optional yyyy-MM: no rent is expected before this month. Set it to the month
# payments started being recorded in this system, to avoid false arrears.
rent.calculation.start-month=${RENT_CALCULATION_START_MONTH:}

# ── Monthly pending rent report (ONE email to the owner; renters are never emailed) ──
rent.reminder.enabled=true
rent.reminder.day=25
rent.reminder.hour=9
rent.reminder.minute=0
rent.reminder.zone=Asia/Kolkata
# TODO: replace with the owner's email address (the only recipient)
rent.reminder.owner-email=owner@example.com
# false = no email in a month where nobody has pending rent (only a log line)
rent.reminder.send-when-no-pending=false
rent.reminder.from=${MAIL_FROM:${MAIL_USERNAME:}}

# SMTP (e.g. Gmail with an app password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ── Renter rent SMS reminder (one SMS per renter per rent month once its due date has passed) ──
# Off by default. Set SMS_ENABLED=true; with the mock provider the SMS is only logged.
sms.enabled=${SMS_ENABLED:false}
# mock | twilio
sms.provider=${SMS_PROVIDER:mock}
# Provider credentials come from environment variables only; never commit them.
# twilio: SMS_API_URL defaults to https://api.twilio.com, SMS_API_KEY = Auth Token,
#         SMS_ACCOUNT_SID = Account SID, SMS_SENDER_ID = your Twilio phone number (+1...)
sms.api-url=${SMS_API_URL:}
sms.api-key=${SMS_API_KEY:}
sms.account-sid=${SMS_ACCOUNT_SID:}
sms.sender-id=${SMS_SENDER_ID:}
sms.country-code=91
sms.timeout-seconds=10
# Total attempts for a month's SMS that keeps failing (retried on the next daily run)
sms.max-attempts=3
sms.signature=${SMS_SIGNATURE:Rent Management System}
# Daily check, in rent.reminder.zone
rent.sms-reminder.cron=${RENT_SMS_REMINDER_CRON:0 0 9 * * *}
